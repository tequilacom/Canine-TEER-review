const dec = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function tryUnlock(pw) {
  const bytes = dec(PAYLOAD);
  const salt = bytes.slice(0, 16), iv = bytes.slice(16, 28), tag = bytes.slice(28, 44), ct = bytes.slice(44);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
                                            km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  // WebCrypto expects ciphertext with the GCM tag appended
  const all = new Uint8Array(ct.length + tag.length);
  all.set(ct); all.set(tag, ct.length);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, all);
  return new TextDecoder().decode(pt);
}

function norm(s) { return s.trim().replace(/\s+/g, ' ').toLowerCase(); }

document.getElementById('go').addEventListener('click', run);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });

async function run() {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const raw = document.getElementById('pw').value;
  if (!raw) return;
  btn.disabled = true; err.style.display = 'none';
  const cands = Array.from(new Set([norm(raw), norm(raw).replace(/\s+/g, '')]));
  for (const pw of cands) {
    try {
      const html = await tryUnlock(pw);
      document.open('text/html', 'replace');
      document.write(html);
      document.close();
      return;
    } catch (e) { /* wrong password */ }
  }
  err.style.display = 'block';
  btn.disabled = false;
}
